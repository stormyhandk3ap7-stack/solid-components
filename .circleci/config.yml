version: 2.1

jobs:
  linter_nico-push:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Store intermediate blob
          command: |
            mkdir -p /tmp/share
            set +o pipefail 2>/dev/null; yes abc | head -n 1106847 | sha1sum > /tmp/share/phase-done.sig; true
            du -h /tmp/share/phase-done.sig
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - phase-done.sig
  nico-push:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
          name: Grab prior data
          command: |
            du -b /tmp/share/phase-done.sig || true
      - run:
          name: Pull sources
          command: git clone --quiet --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore inputs
          command: tar xf output.tar
      - run:
          name: Hash artifacts
          command: uptime
      - run:
          name: Validate binary
          command: sleep 60
      - run:
          command: df -h
      - run:
          no_output_timeout: 110m
          command: "./worker"
  p1_ensure-nightly-artifact-bundle:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
